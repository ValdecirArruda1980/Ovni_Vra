<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OvniVra – Monitor de Objetos Não Identificados</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050811; color: #00ffaa; font-family: 'Consolas', 'Courier New', monospace; height: 100vh; overflow: hidden; }
        #app { display: flex; height: 100vh; width: 100vw; }
        #map { flex: 3; background: #020408; }
        #sidebar { flex: 1; min-width: 340px; max-width: 440px; background: #09101f; border-left: 2px solid #00ffaa; padding: 20px; overflow-y: auto; }
        h1 { font-size: 20px; color: #00ffaa; border-bottom: 1px solid #00ffaa; padding-bottom: 8px; margin-bottom: 15px; text-shadow: 0 0 8px #00ffaa; }
        .ufo-card { background: #0e1a30; border: 1px solid #00ffaa; border-radius: 4px; padding: 12px; margin-bottom: 12px; font-size: 12px; line-height: 1.6; cursor: pointer; transition: all 0.2s; }
        .ufo-card:hover { background: #132748; border-color: #38bdf8; }
        .ufo-card.warning { border-color: #ff0055; color: #ff6688; }
        .ufo-card.warning:hover { border-color: #ff3377; }
        .ufo-title { font-weight: bold; font-size: 14px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #00ffaa; color: #000; padding: 2px 6px; font-weight: bold; border-radius: 3px; font-size: 10px; }
        .badge-warn { background: #ff0055; color: #fff; }
        .refresh-btn { width: 100%; padding: 10px; background: #00ffaa; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 10px; }
        .refresh-btn:hover { background: #00cc88; }
        .search-input { width: 100%; padding: 10px; background: #020408; border: 1px solid #00ffaa; color: #00ffaa; border-radius: 4px; margin-bottom: 15px; font-family: inherit; outline: none; }
        .search-input:focus { border-color: #38bdf8; box-shadow: 0 0 5px #38bdf8; }
        .coord-txt { color: #38bdf8; font-weight: bold; }
        .city-txt { color: #facc15; font-weight: bold; }
        .city-start-txt { color: #38bdf8; font-weight: bold; }

        /* Estilos CSS Geométricos Profissionais para os Ícones */
        .ufo-icon-container {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .shape-plasma {
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #fff 0%, #ff6600 60%, #cc3300 100%);
            border-radius: 50%;
            box-shadow: 0 0 10px #ff6600, 0 0 15px #ff3300;
        }
        .shape-triangle {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 15px solid #15803d;
            filter: drop-shadow(0 0 4px #166534);
        }
        .shape-charuto {
            width: 18px;
            height: 8px;
            background: linear-gradient(to bottom, #78350f, #451a03);
            border-radius: 4px;
            box-shadow: 0 0 6px #291002;
        }
        .shape-cylinder {
            width: 8px;
            height: 18px;
            background: linear-gradient(to right, #222, #555, #222);
            border: 1px solid #777;
            border-radius: 3px;
            box-shadow: 0 0 6px #444;
        }
        .shape-nave {
            width: 18px;
            height: 10px;
            background: linear-gradient(to bottom, #cbd5e1, #64748b, #334155);
            border-radius: 50%;
            border: 1px solid #e2e8f0;
            box-shadow: 0 0 8px #94a3b8;
        }
        .shape-nasa {
            width: 12px;
            height: 12px;
            background: #ff0055;
            transform: rotate(45deg);
            box-shadow: 0 0 8px #ff0055;
        }
        /* Ícone Estilizado da ISS */
        .shape-satelite {
            width: 28px;
            height: 14px;
            background: linear-gradient(90deg, #1e3a8a 30%, #e2e8f0 30%, #e2e8f0 70%, #1e3a8a 70%);
            border: 1px solid #94a3b8;
            border-radius: 2px;
            box-shadow: 0 0 8px #38bdf8;
            position: relative;
        }
        .shape-satelite::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 11px;
            width: 6px;
            height: 4px;
            background: #ffffff;
            border-radius: 1px;
        }
        /* Ícone Exclusivo para a Starlink (Ciano Elétrico com feixe de comunicação) */
        .shape-starlink {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #38bdf8 0%, #0284c7 70%, #0369a1 100%);
            border-radius: 50%;
            border: 2px solid #bae6fd;
            box-shadow: 0 0 12px #38bdf8, 0 0 20px #0284c7;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="map"></div>
        <div id="sidebar">
            <h1>🛸 OVNIVRA MONITOR</h1>
            <button class="refresh-btn" onclick="loadUfoData()">VARREDURA RADAR EM TEMPO REAL</button>
            <input type="text" id="search-box" class="search-input" placeholder="Pesquisar (ex: ISS, Starlink, Apophis)..." oninput="filtrarObjetos()" />
            <div id="status-box">Buscando sinais de anomalias...</div>
            <hr style="border-color: #00ffaa; margin: 15px 0;">
            <div id="ufo-list"></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { preferCanvas: true }).setView([0, 0], 2);
        
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom'
        }).addTo(map);

        let markers = [];
        let trajectoryGroup = L.featureGroup().addTo(map);
        let todosOsEventos = [];

        map.on('click', () => {
            trajectoryGroup.clearLayers();
        });

        function getShapeConfig(item) {
            const shape = (item.shape || '').toLowerCase();
            const idObj = (item.id || '').toLowerCase();

            if (idObj.includes('starlink') || shape.includes('starlink')) {
                return { css: 'shape-starlink', name: 'Constelação Starlink (LEO)', iconSymbol: '🛰️' };
            }
            if (idObj.includes('sat-') || shape.includes('satélite') || shape.includes('satelite')) {
                return { css: 'shape-satelite', name: 'Estação Espacial / Satélite (ISS)', iconSymbol: '🛰️' };
            }
            if (item.source.includes("NASA") || shape.includes('asteroide')) {
                return { css: 'shape-nasa', name: 'Asteroide / Corpo Espacial (NASA)', iconSymbol: '☄️' };
            }
            
            if (shape.includes('triângulo') || shape.includes('triangulo')) return { css: 'shape-triangle', name: 'Triângulo Anômalo', iconSymbol: '▲' };
            if (shape.includes('esfera') || shape.includes('orb') || shape.includes('luminosa')) return { css: 'shape-plasma', name: 'Esfera Luminosa (Plasma)', iconSymbol: '🟠' };
            if (shape.includes('charuto')) return { css: 'shape-charuto', name: 'Charuto Tático', iconSymbol: '🔴' };
            if (shape.includes('tic-tac') || shape.includes('cilindro')) return { css: 'shape-cylinder', name: 'Cilindro Tático', iconSymbol: '🔋' };
            if (shape.includes('disco') || shape.includes('nave')) return { css: 'shape-nave', name: 'Nave Metálica', iconSymbol: '🛸' };
            
            return { css: 'shape-nave', name: 'Vetor Anômalo', iconSymbol: '🛸' };
        }

        async function obterNomeCidade(lat, lon, countryFallback) {
            if (countryFallback === "Espaço Profundo" || countryFallback === "Órbita Terrestre") return "Órbita Terrestre / Oceano";
            try {
                const resp = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pt`);
                if (resp.ok) {
                    const d = await resp.json();
                    const cidade = d.city || d.locality || d.principalSubdivision;
                    if (cidade) return cidade;
                }
            } catch(e) {}
            return countryFallback || "Área Oceânica / Não Mapeada";
        }

        function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        async function carregarCidadesVoo(item, prefix) {
            const startPoint = item.trajectory && item.trajectory.length > 0 ? item.trajectory[0] : [item.latitude, item.longitude];
            const currPoint = [item.latitude, item.longitude];

            const [cidadeInicio, cidadeAtual] = await Promise.all([
                obterNomeCidade(startPoint[0], startPoint[1], item.country),
                obterNomeCidade(currPoint[0], currPoint[1], item.country)
            ]);

            const distanciaKm = calcularDistanciaKm(startPoint[0], startPoint[1], currPoint[0], currPoint[1]);

            const elStart = document.getElementById(`${prefix}-start`);
            if (elStart) elStart.innerText = cidadeInicio;

            const elCurr = document.getElementById(`${prefix}-curr`);
            if (elCurr) elCurr.innerText = cidadeAtual;

            const elDist = document.getElementById(`${prefix}-dist`);
            if (elDist) elDist.innerText = distanciaKm.toLocaleString() + " km";

            return { cidadeInicio, cidadeAtual, distanciaKm };
        }

        async function desenharTrajeto(item, cidades = {}) {
            trajectoryGroup.clearLayers();

            if (item.trajectory && item.trajectory.length > 1) {
                const isStarlink = item.id.toLowerCase().includes("starlink");
                const isSatelite = item.id.includes("SAT");
                const isNasa = item.source.includes("NASA") && !isSatelite;
                
                const color = isStarlink ? '#38bdf8' : (isSatelite ? '#818cf8' : (isNasa ? '#ff0055' : '#00ffaa'));

                L.polyline(item.trajectory, {
                    color: '#000000',
                    weight: 7,
                    opacity: 0.8
                }).addTo(trajectoryGroup);

                L.polyline(item.trajectory, {
                    color: color,
                    weight: 4,
                    dashArray: '8, 10',
                    opacity: 1.0
                }).addTo(trajectoryGroup);

                const pontoOrigem = item.trajectory[0];
                const labelOrigem = cidades.cidadeInicio ? `Início: ${cidades.cidadeInicio}` : 'Início da Trajetória';

                L.circleMarker(pontoOrigem, {
                    radius: 6,
                    color: '#ffffff',
                    fillColor: color,
                    fillOpacity: 1
                }).bindTooltip(labelOrigem, { permanent: true, direction: 'top' }).addTo(trajectoryGroup);

                trajectoryGroup.bringToFront();
            }
        }

        function renderizarListaEMarcadores(eventosParaRenderizar) {
            const listContainer = document.getElementById('ufo-list');
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            listContainer.innerHTML = '';

            eventosParaRenderizar.forEach((item, idx) => {
                const isNasa = item.source.includes("NASA") && !item.id.includes("SAT");
                const shapeCfg = getShapeConfig(item);
                const keyId = `ufo-${idx}`;

                if (item.latitude && item.longitude) {
                    const customDivIcon = L.divIcon({
                        className: '',
                        html: `<div class="ufo-icon-container"><div class="${shapeCfg.css}"></div></div>`,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });

                    const marker = L.marker([item.latitude, item.longitude], { icon: customDivIcon }).addTo(map);

                    const popupContent = `
                        <b style="color:#00ffaa">${shapeCfg.iconSymbol} ${item.id}</b><br>
                        <b>CIDADE INÍCIO:</b> <span class="city-start-txt" id="pop-${keyId}-start">Localizando...</span><br>
                        <b>CIDADE ATUAL:</b> <span class="city-txt" id="pop-${keyId}-curr">Localizando...</span><br>
                        <b>PAÍS / REGIÃO:</b> ${item.country}<br>
                        <b>COORDENADAS:</b> ${item.latitude}, ${item.longitude}<br>
                        <b>DISTÂNCIA PERCORRIDA:</b> <span style="color:#00ffaa; font-weight:bold;" id="pop-${keyId}-dist">Calculando...</span><br>
                        <b>FORMA/TIPO:</b> ${shapeCfg.name}<br>
                        <b>VELOCIDADE:</b> ${item.speed_kmh.toLocaleString()} km/h<br>
                        <b>ALTITUDE:</b> ${item.altitude_m.toLocaleString()} m<br>
                        <b>FONTE:</b> ${item.source}
                    `;

                    marker.bindPopup(popupContent);
                    
                    marker.on('popupopen', async () => {
                        const resCidades = await carregarCidadesVoo(item, `pop-${keyId}`);
                        carregarCidadesVoo(item, `card-${keyId}`);
                        desenharTrajeto(item, resCidades);
                    });

                    markers.push(marker);
                }

                const card = document.createElement('div');
                card.className = `ufo-card ${isNasa ? 'warning' : ''}`;
                const startPt = item.trajectory && item.trajectory.length > 0 ? item.trajectory[0] : [item.latitude, item.longitude];
                const distCalc = calcularDistanciaKm(startPt[0], startPt[1], item.latitude, item.longitude);

                card.innerHTML = `
                    <div class="ufo-title">
                        <span>${shapeCfg.iconSymbol} ${item.id}</span>
                        <span class="badge ${isNasa ? 'badge-warn' : ''}">${item.source}</span>
                    </div>
                    <b>CIDADE INÍCIO:</b> <span class="city-start-txt" id="card-${keyId}-start">${item.country}</span><br>
                    <b>CIDADE ATUAL:</b> <span class="city-txt" id="card-${keyId}-curr">${item.country}</span><br>
                    <b>PAÍS / REGIÃO:</b> ${item.country}<br>
                    <b>COORDENADAS:</b> <span class="coord-txt">${item.latitude}, ${item.longitude}</span><br>
                    <b>DISTÂNCIA PERCORRIDA:</b> <span style="color:#00ffaa; font-weight:bold;">${distCalc.toLocaleString()} km</span><br>
                    <b>FORMA:</b> ${shapeCfg.name}<br>
                    <b>VELOCIDADE:</b> ${item.speed_kmh.toLocaleString()} km/h<br>
                    <b>ALTITUDE:</b> ${item.altitude_m.toLocaleString()} m<br>
                    <p style="margin-top: 5px; opacity: 0.85;">${item.summary}</p>
                `;

                card.onclick = async (e) => {
                    e.stopPropagation();
                    const resCidades = await carregarCidadesVoo(item, `card-${keyId}`);
                    desenharTrajeto(item, resCidades);
                    map.flyTo([item.latitude, item.longitude], Math.max(map.getZoom(), 6), { duration: 1 });
                };

                listContainer.appendChild(card);
            });
        }

        function filtrarObjetos() {
            const termo = document.getElementById('search-box').value.toLowerCase();
            const filtrados = todosOsEventos.filter(item => 
                item.id.toLowerCase().includes(termo) || 
                item.shape.toLowerCase().includes(termo) || 
                item.source.toLowerCase().includes(termo) ||
                item.summary.toLowerCase().includes(termo)
            );
            renderizarListaEMarcadores(filtrados);
        }

        async function loadUfoData() {
            const statusBox = document.getElementById('status-box');
            statusBox.innerHTML = "🛰️ Conectando com radares e sensores de espaço...";
            try {
                const response = await fetch('/api/live-ufo');
                const result = await response.json();
                todosOsEventos = result.data;

                statusBox.innerHTML = `
                    <b>ANOMALIAS RASTREADAS:</b> <span style="color:#facc15; font-size:16px;">${result.total_anomalies_tracked}</span><br>
                    <b>FILTRO AÉREO:</b> Tráfego Civil Descartado.<br>
                    <small style="color:#38bdf8;">Clique em qualquer objeto para ver origem e cidade atual.</small>
                `;
                
                renderizarListaEMarcadores(todosOsEventos);
            } catch (err) {
                statusBox.innerHTML = "❌ Erro ao atualizar radar. Tente novamente.";
                console.error(err);
            }
        }

        loadUfoData();
        setInterval(loadUfoData, 30000);
    </script>
</body>
</html>
