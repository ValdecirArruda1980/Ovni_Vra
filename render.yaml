services:
  - type: web
    name: ovnivra-web
    env: python
    region: ohio # ou o datacenter de sua preferência (ex: frankfurt, oregon)
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
